# Postgres 16 para desenvolvimento e testes locais.
# O banco efêmero de teste roda na porta 5433 e é recriado a cada subida.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: poketche-db
    environment:
      POSTGRES_USER: poketche
      POSTGRES_PASSWORD: poketche
      POSTGRES_DB: poketche
    ports:
      # 5432 costuma estar ocupada por outro Postgres local; usamos 5434 no host.
      - '5434:5432'
    volumes:
      - poketche-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poketche']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: pgvector/pgvector:pg16
    container_name: poketche-db-test
    environment:
      POSTGRES_USER: poketche
      POSTGRES_PASSWORD: poketche
      POSTGRES_DB: poketche_test
    ports:
      # 5433 também costuma estar ocupada; usamos 5435 no host p/ o banco de teste.
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poketche']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  poketche-db-data:
